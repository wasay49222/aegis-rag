name: Aegis-RAG CI/CD Pipeline

on:
  # Trigger this pipeline whenever code is pushed or a PR is opened against the main branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Code Quality (Linting)
  lint:
    name: Code Quality (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Linters
        run: pip install black flake8
      
      - name: Run Black (Check Formatting)
        run: black --check .
      
      - name: Run Flake8 (Check for Syntax Errors)
        # We only check for critical errors (F) to prevent failing on minor style differences
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # JOB 2: Docker Build Verification
  build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: lint # This job will only run if the 'lint' job passes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Build Docker Images
        # This proves that your Dockerfile and requirements.txt are not broken
        run: docker-compose build