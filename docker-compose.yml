services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_password
      POSTGRES_DB: aegis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"

  # 3. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aegis-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # 4. FastAPI Backend
  backend:
    build: ./backend
    container_name: aegis-backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant
    environment:
      DATABASE_URL: postgresql://aegis_user:aegis_password@localhost:5432/aegis_db
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      OLLAMA_URL: http://host.docker.internal:11434/api/generate

  # 5. Next.js Frontend (Placeholder for Level 14)
  frontend:
    build: ./frontend
    container_name: aegis-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data: